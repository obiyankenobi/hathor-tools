# =============================================================================
# Hathor Testnet Faucet - OpenResty configuration
# =============================================================================

# Per-IP burst rate limit (short-term flood protection).
limit_req_zone $binary_remote_addr zone=faucet_limit:10m rate=6r/m;

# Per-IP cooldown tracker (long-term drain protection).
# 10MB ≈ ~80k entries, plenty for a testnet faucet.
lua_shared_dict faucet_ip_tracker 10m;

# reCAPTCHA secret. Edit before `docker build`.
lua_shared_dict captcha_config 1m;
init_by_lua_block {
    ngx.shared.captcha_config:set("secret", "YOUR_RECAPTCHA_SECRET_KEY")
}

# DNS + SSL trust for the outbound call to Google's siteverify.
# ipv6=off because the container has no IPv6 route by default; without
# this, the resolver returns AAAA records for www.google.com first and
# lua-resty-http fails with "network unreachable" before even handshaking.
resolver 8.8.8.8 8.8.4.4 ipv6=off valid=300s;
resolver_timeout 5s;
lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

server {
    listen 8082;
    server_name localhost;

    # -------------------------------------------------------------------------
    # Real client IP restoration.
    #
    # Behind the outer reverse proxy (main-nginx.conf), $remote_addr would
    # otherwise be 127.0.0.1, which would silently turn rate limiting and
    # the IP cooldown into GLOBAL limits across all clients. These directives
    # tell nginx to trust X-Forwarded-For from the host loopback and the
    # default Docker bridge network, and rewrite $remote_addr accordingly.
    # -------------------------------------------------------------------------
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.17.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # Static UI
    location / {
        root /usr/share/nginx/html;
        index faucet.html;
        try_files $uri $uri/ /faucet.html;
    }

    # -------------------------------------------------------------------------
    # Networks. Each one is a separate wallet headless on the host:
    #   testnet   /wallet/*            -> 172.17.0.1:8000
    #   shielded  /shielded/wallet/*   -> 172.17.0.1:8001
    #
    # The drip logic (cooldown, captcha, value injection) lives in faucet.lua
    # and is shared; the network name only namespaces the per-IP cooldown.
    # The burst rate limit zone is shared across networks on purpose.
    # -------------------------------------------------------------------------

    # Read-only proxy to the wallet headless balance endpoint.
    location /wallet/balance {
        proxy_pass http://172.17.0.1:8000/wallet/balance;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-wallet-id id;
    }

    # Faucet drip endpoint.
    location /wallet/simple-send-tx {
        # Short-term burst limit. Fires before the Lua access phase, so a
        # rate-limited client doesn't burn a captcha verification.
        limit_req zone=faucet_limit burst=1 nodelay;
        limit_req_status 429;

        access_by_lua_block      { require("faucet").access("testnet") }
        body_filter_by_lua_block { require("faucet").body_filter("testnet") }

        proxy_pass http://172.17.0.1:8000/wallet/simple-send-tx;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-wallet-id id;
    }

    # Shielded testnet balance.
    location /shielded/wallet/balance {
        proxy_pass http://172.17.0.1:8001/wallet/balance;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-wallet-id id;
    }

    # Shielded testnet drip.
    location /shielded/wallet/simple-send-tx {
        limit_req zone=faucet_limit burst=1 nodelay;
        limit_req_status 429;

        access_by_lua_block      { require("faucet").access("shielded") }
        body_filter_by_lua_block { require("faucet").body_filter("shielded") }

        proxy_pass http://172.17.0.1:8001/wallet/simple-send-tx;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-wallet-id id;
    }
}
