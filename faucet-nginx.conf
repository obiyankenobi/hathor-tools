# =============================================================================
# Hathor Testnet Faucet - OpenResty configuration
# =============================================================================

# Per-IP burst rate limit (short-term flood protection).
limit_req_zone $binary_remote_addr zone=faucet_limit:10m rate=6r/m;

# Per-IP cooldown tracker (long-term drain protection).
# 10MB ≈ ~80k entries, plenty for a testnet faucet.
lua_shared_dict faucet_ip_tracker 10m;

# reCAPTCHA secret. Edit before `docker build`.
lua_shared_dict captcha_config 1m;
init_by_lua_block {
    ngx.shared.captcha_config:set("secret", "YOUR_RECAPTCHA_SECRET_KEY")
}

# DNS + SSL trust for the outbound call to Google's siteverify.
resolver 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout 5s;
lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

server {
    listen 8082;
    server_name localhost;

    # -------------------------------------------------------------------------
    # Real client IP restoration.
    #
    # Behind the outer reverse proxy (main-nginx.conf), $remote_addr would
    # otherwise be 127.0.0.1, which would silently turn rate limiting and
    # the IP cooldown into GLOBAL limits across all clients. These directives
    # tell nginx to trust X-Forwarded-For from the host loopback and the
    # default Docker bridge network, and rewrite $remote_addr accordingly.
    # -------------------------------------------------------------------------
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.17.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # Static UI
    location / {
        root /usr/share/nginx/html;
        index faucet.html;
        try_files $uri $uri/ /faucet.html;
    }

    # Read-only proxy to the wallet headless balance endpoint.
    location /wallet/balance {
        proxy_pass http://172.17.0.1:8000/wallet/balance;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-wallet-id id;
    }

    # Faucet drip endpoint.
    location /wallet/simple-send-tx {
        # Short-term burst limit. Fires before the Lua access phase, so a
        # rate-limited client doesn't burn a captcha verification.
        limit_req zone=faucet_limit burst=1 nodelay;
        limit_req_status 429;

        access_by_lua_block {
            local http  = require "resty.http"
            local cjson = require "cjson.safe"

            local function deny(status, payload)
                ngx.status = status
                ngx.header["Content-Type"] = "application/json"
                ngx.say(cjson.encode(payload))
                return ngx.exit(ngx.HTTP_OK)
            end

            -- ---------------------------------------------------------------
            -- 1. Per-IP cooldown check (cheap, fail fast before captcha).
            -- ---------------------------------------------------------------
            local client_ip = ngx.var.remote_addr
            if client_ip then
                local tracker = ngx.shared.faucet_ip_tracker
                local last_ts = tracker:get(client_ip)
                if last_ts then
                    local cooldown = 21600  -- 6 hours in seconds
                    local elapsed  = ngx.time() - last_ts
                    local remaining = cooldown - elapsed
                    if remaining > 0 then
                        ngx.header["Retry-After"] = tostring(remaining)
                        return deny(429, {
                            success = false,
                            error = "cooldown",
                            retry_after = remaining,
                        })
                    end
                end
            end

            -- ---------------------------------------------------------------
            -- 2. Captcha token must be present.
            -- ---------------------------------------------------------------
            local token = ngx.req.get_headers()["X-Captcha-Token"]
            if not token or token == "" then
                ngx.log(ngx.WARN, "faucet: missing captcha token from ", client_ip or "?")
                return deny(400, {
                    success = false,
                    error = "Captcha token required",
                })
            end

            -- ---------------------------------------------------------------
            -- 3. Verify captcha with Google.
            -- ---------------------------------------------------------------
            local secret = ngx.shared.captcha_config:get("secret")
            local httpc  = http.new()
            httpc:set_timeouts(2000, 3000, 5000)  -- connect, send, read (ms)

            local body = ngx.encode_args({
                secret   = secret,
                response = token,
                remoteip = client_ip,
            })

            local res, err = httpc:request_uri(
                "https://www.google.com/recaptcha/api/siteverify",
                {
                    method  = "POST",
                    body    = body,
                    headers = {
                        ["Content-Type"] = "application/x-www-form-urlencoded",
                    },
                    ssl_verify = true,
                }
            )

            if not res then
                ngx.log(ngx.ERR, "faucet: captcha siteverify request failed: ", err)
                return deny(502, {
                    success = false,
                    error = "captcha verification unreachable",
                })
            end

            if res.status ~= 200 then
                ngx.log(ngx.ERR, "faucet: captcha siteverify HTTP ", res.status,
                                 " body=", res.body or "")
                return deny(502, {
                    success = false,
                    error = "captcha verification failed",
                })
            end

            local response_data = cjson.decode(res.body or "")
            if not response_data then
                ngx.log(ngx.ERR, "faucet: could not decode captcha response: ",
                                 res.body or "")
                return deny(502, {
                    success = false,
                    error = "captcha verification malformed",
                })
            end

            if not response_data.success then
                ngx.log(ngx.WARN, "faucet: captcha rejected for ", client_ip or "?",
                                  " errors=", cjson.encode(response_data["error-codes"] or {}))
                return deny(400, {
                    success = false,
                    error = "Invalid captcha",
                })
            end

            -- ---------------------------------------------------------------
            -- 4. Rewrite the request body to inject the faucet drip amount.
            --    The client only sends the address; we control the value
            --    server-side so it can never be tampered with.
            -- ---------------------------------------------------------------
            ngx.req.read_body()
            local req_body = ngx.req.get_body_data()
            if not req_body then
                return deny(400, {
                    success = false,
                    error = "Empty request body",
                })
            end

            local data = cjson.decode(req_body)
            if not data or not data.address then
                return deny(400, {
                    success = false,
                    error = "Invalid request body",
                })
            end

            data.value = 100000  -- 1000 HTR (HTR has 2 decimals)
            ngx.req.set_body_data(cjson.encode(data))
        }

        # Set the per-IP cooldown only if the wallet actually accepted the
        # request *and* returned a successful body. The wallet headless can
        # respond 200 with {"success": false, ...} for application errors
        # (insufficient funds, invalid address, etc.) — those should NOT
        # consume a cooldown slot.
        #
        # We buffer the upstream body in ngx.ctx without modifying it (we
        # pass ngx.arg[1] through untouched), then on EOF check for the
        # success marker and set the tracker entry.
        body_filter_by_lua_block {
            if ngx.status ~= 200 then return end
            ngx.ctx.faucet_buf = (ngx.ctx.faucet_buf or "") .. (ngx.arg[1] or "")
            if ngx.arg[2] then  -- eof
                if ngx.ctx.faucet_buf:find('"success":true', 1, true)
                   or ngx.ctx.faucet_buf:find('"success": true', 1, true) then
                    local ip = ngx.var.remote_addr
                    if ip then
                        ngx.shared.faucet_ip_tracker:set(ip, ngx.time(), 21600)
                    end
                end
            end
        }

        proxy_pass http://172.17.0.1:8000/wallet/simple-send-tx;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-wallet-id id;
    }
}
